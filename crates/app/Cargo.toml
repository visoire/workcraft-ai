[package]
name = "workcraft-app"
description = "WorkCraft desktop app (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "workcraft"
path = "src/main.rs"

[dependencies]
workcraft-core.workspace = true
workcraft-control.workspace = true
workcraft-agents.workspace = true
serde_json.workspace = true
tokio.workspace = true
# clipboard: copy buttons; links: opening URLs; accesskit: screen readers.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links", "accesskit"] }
base64.workspace = true
chrono.workspace = true
image.workspace = true
rfd = "0.15"

[lints]
workspace = true
